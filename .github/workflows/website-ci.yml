name: website
on:
  push:
    paths:
      - "website/**"
      - "BLOOM_FILTERS/**"
  pull_request:
    paths:
      - "website/**"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run catalog
      - run: npm run build
