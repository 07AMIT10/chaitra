title: "Bellman–Ford"
slug: bellman-ford
field: programming
fieldLabel: "Programming"
reframe: "It is not a slower Dijkstra for broken edges. It is a deflationary gravity: a monotone operator pressing down on every road simultaneously until distances freeze into their least fixed point—or spiral endlessly into a negative abyss."
oneLine: "Dijkstra freezes T at 12; relax all edges across 4 rounds to uncover the -11 siphon."
tldr:
  - "The state is one distance vector; a round applies the relaxation operator to every edge at once."
  - "The operator is monotone and deflationary, so n−1 rounds reach the fixed point of the Bellman equation."
  - "The n-th round is the negative-cycle test, and a reachable negative cycle is exactly the case where no fixed point exists."
  - "In min-plus algebra the same run reads one row of the tropical closure, the sum of L^(k) for k up to n−1."
