title: "Binary Search"
slug: binary-search
field: programming
fieldLabel: "Programming"
reframe: "To search a billion records, a linear scan must traverse the continent of data footprint by footprint. Binary search cuts the entire continent in half thirty times. In thirty questions, a search space larger than humanity collapses to a single atom."
oneLine: "Scan 10^18 records for 31.7 years, or split the sorted horizon in 60 comparisons flat."
tldr:
  - "The state is an interval that always contains the answer; every comparison deletes at least half of what is left."
  - "T(n) = T(n/2) + 1 solves to floor(log2 n) + 1, which is ceil(log2(n+1)) — the logarithm derived, not assumed."
  - "k two-outcome comparisons reach at most 2^k leaves, so n + 1 possible answers force k >= ceil(log2(n+1)): binary search is exactly optimal in the comparison model, and the model is the fine print."
  - "The same boundary search is bisection, because every false-then-true predicate has a first-true position."
