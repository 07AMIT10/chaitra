title: "Bipartite Matching"
slug: bipartite-matching
field: programming
fieldLabel: "Programming"
reframe: "It is not pairing things up greedily. It is a set of independent edges, grown along augmenting paths and pinned from both sides."
oneLine: "Four applicants, four placements, six acceptable pairs, and a ceiling of three."
tldr:
  - "A matching is a set of edges with no shared endpoints; greedy first-available pairing can strand a vertex that an augmenting path would have saved."
  - "Hall's condition (Hall 1935) certifies impossibility from the left: the pair {Cara, Dan} shares a single neighbour, so no matching covers all four applicants."
  - "Berge's condition (Berge 1957) certifies optimality from the search: with no augmenting path left, the size-3 matching is maximum."
  - "König's theorem (König 1931) pins the same number from the cover side, and the unit-capacity flow reduction (Ford–Fulkerson 1956) makes it fall out of pipes."
mathBranches: [combinatorics, graph-theory, optimization]
primitives: [MatchingBoard, PredictionPrompt, LPDualityDashboard]
attributions: ["Hall 1935", "König 1931", "Berge 1957", "Ford–Fulkerson 1956", "Hopcroft–Karp 1973", "Birkhoff 1946"]
