title: "Coin Change"
slug: coin-change
field: programming
fieldLabel: "Programming"
reframe: "The cashier's reflex to grab the largest coin is an arithmetic trap. Minimum coin change is a shortest path through a discrete lattice of debt, and greedy choices tumble into disaster the instant a currency ceases to be canonical."
oneLine: "Greedy burns three coins (4+1+1) where two (3+3) settle the debt: how shortest paths solve non-canonical change."
tldr:
  - "Every cell of the table is a shortest-path distance on the amounts 0 to the amount, where each coin is an edge of weight one."
  - "Greedy spends 4 + 1 + 1 on 6 with coins 1, 3 and 4; the true minimum is 3 + 3, and the table's corner reads 2."
  - "Greedy is optimal for every amount exactly when the coin system is canonical, a property Pearson 2005 decides in O(n³) even though the largest coin may be huge."
  - "The general minimum-coin problem is only weakly NP-hard: the standard O(n·amount) table is polynomial once the amount is written in unary."
