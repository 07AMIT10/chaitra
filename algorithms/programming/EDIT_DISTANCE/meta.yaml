title: "Edit Distance"
slug: edit-distance
field: programming
fieldLabel: "Programming"
reframe: "It is not a count of differing characters. It is the geodesic distance in the graph of all strings, where each edit is an edge."
oneLine: "The fewest insertions, deletions and substitutions that turn one string into another."
tldr:
  - "Every cell of the table is a shortest-path distance in the graph of strings, and hovering it lights the three edges that reach it."
  - "With insert and delete only, the distance collapses to the identity m + n − 2·LCS."
  - "A test for distance ≤ k needs only the diagonal band |i − j| ≤ k — O(nk) cells, not the O(n²) full table."
mathBranches: [graph-theory, metric-geometry, combinatorics]
primitives: [DPHeatmap, PredictionPrompt, SeriesChart]
attributions: ["Levenshtein 1965", "Needleman–Wunsch 1970", "Wagner–Fischer 1974"]
relatedTopics: [spam-detection, information-theory]
