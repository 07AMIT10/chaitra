title: "Edit Distance"
slug: edit-distance
field: programming
fieldLabel: "Programming"
reframe: "Every word is a coordinate in an infinite space of strings. Insert, delete, and mutate are unit vectors across its grid; edit distance is the exact geodesic, carving the shortest trek through a lattice of prefixes."
oneLine: "A single shifted byte shows 8 false mismatches; tile the prefix grid to find the true distance of 2."
tldr:
  - "Every cell of the table is a shortest-path distance in the graph of strings, and hovering it lights the three edges that reach it."
  - "With insert and delete only, the distance collapses to the identity m + n − 2·LCS."
  - "A test for distance ≤ k needs only the diagonal band |i − j| ≤ k — O(nk) cells, not the O(n²) full table."
