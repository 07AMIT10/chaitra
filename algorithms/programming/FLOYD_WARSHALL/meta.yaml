title: "Floyd–Warshall"
slug: floyd-warshall
field: programming
fieldLabel: "Programming"
reframe: "It is not a road-trip calculator. It is a universal matrix inversion engine: swap out two algebraic symbols, and the exact same four-line loop morphs from pricing shortest paths into counting quantum walks, proving reachability, or decoding hidden Markov trellises."
oneLine: "Four lines and 10^9 updates solve all-pairs distances for 1,000 towns: how three nested loops sweep a network."
tldr:
  - "The four-line triple loop uses only ⊕, ⊗, 0 and 1; the semiring axioms are its entire hypothesis."
  - "Swap the semiring and the same grid reads as cheapest routes, route counts, reachability, or longest routes."
  - "The in-place update is exact when ⊕ is idempotent, so addition — the one non-idempotent choice — is the panel that over-counts."
  - "The closure is a matrix inverse in a semiring: A* = I + A + A² + ⋯ = (I − A)⁻¹ when the series converges."
