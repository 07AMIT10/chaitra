title: "Longest Common Subsequence"
slug: longest-common-subsequence
field: programming
fieldLabel: "Programming"
reframe: "It is not the letters two strings share. It is the tallest chain in the product of their prefix orders, and the DP table labels every cell with its height."
oneLine: "The longest word that appears, in order, inside both strings."
tldr:
  - "A common subsequence is a chain in the product order on the matching cells (i, j) with a[i] = b[j]; the DP table writes the height of each rectangle into its corner."
  - "With insert and delete only, the distance between the strings is exactly m + n − 2·LCS — the cost of the cheapest monotone staircase through the grid."
  - "Computing the length is O(mn), but the number of distinct longest common subsequences can be 2^(n/2): polynomial to measure, exponential to list."
  - "When one string is a rearrangement of the other, LCS is exactly the longest increasing subsequence of the position permutation."
mathBranches: [order-theory, combinatorics, algorithms]
primitives: [DPHeatmap, PredictionPrompt, SeriesChart]
attributions: ["Wagner–Fischer 1974", "Hirschberg 1975", "Myers 1986"]
