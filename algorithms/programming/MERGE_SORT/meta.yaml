title: "Merge Sort"
slug: merge-sort
field: programming
fieldLabel: "Programming"
reframe: "Sorting unordered chaos appears to require combinatorial omniscience. In 1945, John von Neumann proved it requires only a two-finger zipper: split the universe down to isolated atoms, then weave them back together one comparison at a time."
oneLine: "Every sort is a merge; every merge is one linear pass over two chains."
tldr:
  - "Merging sorted lists of lengths p and q costs at most p + q − 1 comparisons, and that join is the only work any level does."
  - "The recurrence T(n) = 2T(n/2) + Θ(n) sums to Θ(n log n): each of the log n levels touches every key exactly once."
  - "For n = 2^k the worst case is exactly n log₂ n − n + 1 comparisons — a derived identity, not an estimate."
  - "That matches the floor ⌈log₂(n!)⌉ = Θ(n log n) to a constant factor, so no comparison sort can beat it asymptotically."
