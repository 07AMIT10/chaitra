title: "Minimum Spanning Tree"
slug: minimum-spanning-tree
field: programming
fieldLabel: "Programming"
reframe: "It is not taking the cheapest edges and hoping. It is finding a minimum-weight basis of a matroid, and greedy is exact because the cut and cycle properties are that matroid's exchange axiom."
oneLine: "One weighted graph, two greedy orders, one forced total — and the axiom that makes greedy provably right."
tldr:
  - "A spanning tree is a basis of the graphic matroid; a minimum spanning tree is a minimum-weight basis."
  - "The cut property and the cycle property are the two faces of Whitney's exchange axiom, and each one proves greedy exact."
  - "Ties decide the tree, never the weight: on the graph below there are exactly two minimum spanning trees, one edge-swap apart."
  - "Greedy breaks the instant independence stops being a matroid — three items and one capacity are enough to see it."
